# Generated by scripts/build_workflow.py. Desktop payload is ZIP + base64, not encryption.
# All unpacked source files are included in the companion source package.

name: TECH Decode Cloud PC - Windows 2022

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Session duration after setup (15-300 minutes)'
        required: true
        default: '120'
        type: string

permissions:
  contents: read

concurrency:
  group: techdecode-cloud-pc
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Unpack verified desktop package
        run: |
          $payload = @'
          [LONG BASE64 PAYLOAD - NOT FULLY VISIBLE IN SCREENSHOT]
          '@
